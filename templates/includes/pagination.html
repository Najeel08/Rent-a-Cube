{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Results pages" class="container d-flex justify-content-between align-items-center py-3">
  {% if page_obj.has_previous %}<a class="cube-btn cube-btn-outline cube-btn-sm" href="?{{ page_query }}&amp;page={{ page_obj.previous_page_number }}">Previous</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="cube-btn cube-btn-outline cube-btn-sm" href="?{{ page_query }}&amp;page={{ page_obj.next_page_number }}">Next</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
