{% load static %}
<header class="cube-navbar cube-responsive-navbar">
	<div class="container cube-navbar-row">
		<a class="navbar-brand" href="/">
			<img class="brand-logo" width="940" height="580" src="{% static 'images/rent-a-cube-logo.svg' %}" alt="Rent-a-Cube Logo">
		</a>
		<button class="cube-nav-toggle" type="button" data-nav-toggle aria-controls="public-navbar" aria-expanded="false" aria-label="Open navigation">
			<i class="fa fa-bars" aria-hidden="true"></i>
		</button>
		<nav class="cube-nav-panel" id="public-navbar" aria-label="Primary navigation">
			<ul class="cube-nav-links">
				<li><a href="/" class="cube-nav-link{% if active_page == 'home' %} active{% endif %}"><i class="fa fa-home" aria-hidden="true"></i> Home</a></li>
				<li><a href="{% url 'contact' %}" class="cube-nav-link{% if active_page == 'contact' %} active{% endif %}"><i class="fa fa-envelope-o" aria-hidden="true"></i> Contact</a></li>
				<li class="cube-nav-dropdown">
					<button class="cube-nav-link cube-nav-dropdown-toggle" type="button" data-nav-dropdown aria-expanded="false" aria-controls="register-nav-menu">
						<span class="cube-nav-dropdown-label"><i class="fa fa-user-plus" aria-hidden="true"></i> Register</span>
						<i class="fa fa-angle-down" aria-hidden="true"></i>
					</button>
					<div class="cube-nav-submenu" id="register-nav-menu" hidden>
						<a class="dropdown-item" href="{% url 'register' %}"><i class="fa fa-user text-primary" aria-hidden="true"></i> Register as User</a>
						<a class="dropdown-item" href="{% url 'owner_register' %}"><i class="fa fa-building text-info" aria-hidden="true"></i> Register as Owner</a>
					</div>
				</li>
				<li class="cube-nav-dropdown">
					<button class="cube-nav-link cube-nav-dropdown-toggle" type="button" data-nav-dropdown aria-expanded="false" aria-controls="signin-nav-menu">
						<span class="cube-nav-dropdown-label"><i class="fa fa-sign-in" aria-hidden="true"></i> Sign In</span>
						<i class="fa fa-angle-down" aria-hidden="true"></i>
					</button>
					<div class="cube-nav-submenu" id="signin-nav-menu" hidden>
						<a class="dropdown-item" href="{% url 'login' %}"><i class="fa fa-user text-primary" aria-hidden="true"></i> Sign In as User</a>
						<a class="dropdown-item" href="{% url 'owner_login' %}"><i class="fa fa-briefcase text-success" aria-hidden="true"></i> Sign In as Owner</a>
						<a class="dropdown-item" href="{% url 'admin_login' %}"><i class="fa fa-shield text-danger" aria-hidden="true"></i> Sign In as Admin</a>
						<a class="dropdown-item" href="{% url 'technician_login' %}"><i class="fa fa-wrench text-warning" aria-hidden="true"></i> Sign In as Technician</a>
					</div>
				</li>
			</ul>
		</nav>
	</div>
</header>
<script src="{% static 'js/responsive_navbar.js' %}" defer></script>
