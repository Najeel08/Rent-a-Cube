{% load static %}
		<aside id="sidebar" class="admin-sidebar">
			<div class="admin-sidebar-header">
				<a href="{% url 'admin_dashboard' %}">
					<img class="brand-logo" width="940" height="580" src="{% static 'images/rent-a-cube-logo.svg' %}" alt="Rent-a-Cube Logo">
				</a>
			</div>

			<div class="admin-sidebar-user">
				<img class="admin-sidebar-user-avatar" src="{% static 'admin/images/layout_img/user_img.jpg' %}" alt="Admin Avatar" style="width: 44px; height: 44px; min-width: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #4F46E5;">
				<div>
					<h6 class="admin-sidebar-user-name">{{ request.session.email|default:"Administrator" }}</h6>
					<p class="admin-sidebar-user-role"><span class="online-dot"></span> Administrator</p>
				</div>
			</div>

			<div class="admin-sidebar-nav">
				<div class="admin-sidebar-nav-title">Management</div>
				<ul class="admin-sidebar-links">
					<li>
						<a href="{% url 'admin_dashboard' %}" class="admin-sidebar-link">
							<i class="fa fa-th-large"></i> <span>Dashboard</span>
						</a>
					</li>
					<li>
						<a href="#ownerMenu"  aria-expanded="true" class="admin-sidebar-link dropdown-toggle active">
							<i class="fa fa-building-o text-primary"></i> <span>Owner Hub</span> <i class="fa fa-angle-down submenu-arrow"></i></a>
						<ul class="collapse show admin-sidebar-submenu" id="ownerMenu">
							<li><a href="{% url 'admin_owner_list' %}" class="admin-sidebar-sublink{% if active_page == 'owners' %} active{% endif %}"><i class="fa fa-id-card-o mr-1"></i> Owners</a></li>
							<li><a href="{% url 'admin_workspace_list' %}" class="admin-sidebar-sublink{% if active_page == 'workspaces' %} active{% endif %}"><i class="fa fa-cubes mr-1"></i> Workspaces</a></li>
							<li><a href="{% url 'admin_order_list' %}" class="admin-sidebar-sublink"><i class="fa fa-shopping-bag mr-1"></i> Bookings</a></li>
						</ul>
					</li>
					<li>
						<a href="#userMenu"  aria-expanded="false" class="admin-sidebar-link dropdown-toggle">
							<i class="fa fa-users"></i> <span>User Hub</span> <i class="fa fa-angle-down submenu-arrow"></i></a>
						<ul class="collapse admin-sidebar-submenu" id="userMenu">
							<li><a href="{% url 'admin_customer_list' %}" class="admin-sidebar-sublink"><i class="fa fa-user-circle-o mr-1"></i> Users</a></li>
							<li><a href="{% url 'admin_booking_list' %}" class="admin-sidebar-sublink"><i class="fa fa-calendar-check-o mr-1"></i> Booking Details</a></li>
							<li><a href="{% url 'admin_support_inquiry_detail' %}" class="admin-sidebar-sublink"><i class="fa fa-commenting-o mr-1"></i> Feedback</a></li>
						</ul>
					</li>
					<li>
						<a href="{% url 'admin_workspace_images' %}" class="admin-sidebar-link">
							<i class="fa fa-file-image-o"></i> <span>Workspace Photos</span>
						</a>
					</li>
					<li>
						<a href="{% url 'admin_profile' %}" class="admin-sidebar-link">
							<i class="fa fa-user"></i> <span>Admin Profile</span>
						</a>
					</li>
					<li class="mt-3 pt-3 border-top" style="border-color: #1E293B !important;">
						<form method="post" action="{% url 'logout' %}" class="cube-logout-form">
{% csrf_token %}
<button type="submit" class="admin-sidebar-link text-danger cube-logout-admin"><i class="fa fa-sign-out text-danger"></i> <span class="text-danger">Log Out</span></button>
</form>
					</li>
				</ul>
			</div>
		</aside>
